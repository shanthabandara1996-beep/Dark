      <li><code>no-referrer</code>: sites you open don't learn where you came from.</li>
      <li>Bookmarks stay in <code>localStorage</code> on this device only. Export to JSON to move them.</li>
      <li><b>Esc</b> = boss key, whole page blanks instantly.</li>
    </ul>

    <h2>5 // host it yourself</h2>
    <p>GitHub → new repo → add <code>index.html</code> → Settings → Pages → branch <code>main</code>,
    root → Save. Done. Your own copy, no dependency on this chat.</p>
  </div>`;
}

/* ---- events ----------------------------------------------- */
document.addEventListener("click", e => {
  const tab = e.target.closest(".tab");
  if(tab){ state.tab = tab.dataset.tab; state.cat = "all"; render(); return; }

  const chip = e.target.closest(".chip");
  if(chip){ state.cat = chip.dataset.cat; buildChips(); render(); return; }

  const act = e.target.closest("[data-act]");
  if(!act) return;

  if(act.dataset.act === "copy"){ copy("http://" + act.dataset.addr + "/"); return; }

  if(act.dataset.act === "star"){
    const id = act.dataset.id;
    state.saved = state.saved.includes(id)
      ? state.saved.filter(x => x !== id)
      : [...state.saved, id];
    save();
    act.classList.toggle("on");
    toast(state.saved.includes(id) ? "SAVED" : "REMOVED");
    if(state.tab === "saved") render();
  }
});

$("#q").addEventListener("input", e => { state.q = e.target.value; render(); });

$("#rand").addEventListener("click", () => {
  const pool = VAULT.filter(s => s.addr || s.clear);
  const pick = pool[Math.floor(Math.random() * pool.length)];
  const url = pick.addr ? (tor ? "http://" + pick.addr + ".onion/" : gw(pick.addr)) : pick.clear;
  window.open(url, "_blank", "noopener,noreferrer");
  toast(pick.name);
});

$("#export").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify(state.saved, null, 2)], { type:"application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "darkvault-saved.json";
  a.click();
  URL.revokeObjectURL(a.href);
});

$("#importBtn").addEventListener("click", () => $("#importFile").click());
$("#importFile").addEventListener("change", async e => {
  const f = e.target.files[0];
  if(!f) return;
  try{
    const arr = JSON.parse(await f.text());
    if(!Array.isArray(arr)) throw 0;
    state.saved = [...new Set([...state.saved, ...arr.filter(x => typeof x === "string")])];
    save(); render(); toast("IMPORTED");
  }catch(_){ toast("BAD FILE"); }
});

const boss = () => $("#boss").classList.toggle("show");
$("#bossBtn").addEventListener("click", boss);
document.addEventListener("keydown", e => {
  if(e.key === "Escape") boss();
  if(e.key === "/" && document.activeElement !== $("#q")){ e.preventDefault(); $("#q").focus(); }
});

/* ---- boot ------------------------------------------------- */
buildChips();
render();
paintTor();
detectTor().then(v => { tor = v; paintTor(); render(); });
</script>
</body>
